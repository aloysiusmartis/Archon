name: archon-fix-azdo-work-item
description: |
  Use when: User wants to FIX, RESOLVE, or IMPLEMENT a solution for an Azure DevOps work item.
  Triggers: "fix this work item", "implement work item 123", "resolve this bug", "fix item",
            "fix work item #123", "resolve AB#123".
  NOT for: Comprehensive multi-agent reviews, questions about items, CI failures, PR reviews.

  Mirrors archon-fix-github-issue but uses Azure DevOps CLI (az) instead of gh.
  Incorporates pc-director's engineering review gate for complex tasks:
  1. Fetches the work item (az boards work-item show)
  2. Classifies type (bug/feature/enhancement/etc) + complexity (simple/complex)
  3. Researches context (web + codebase)
  4. Routes to investigate (bugs) or plan (features)
  5. [Complex tasks only] Engineering review gate — interactive Gate A, user confirms risks
  6. [Complex tasks only] Enriches ADO ticket with HTML eng-review comment + technical AC
  7. Configures quality gates (lint/build/tests/new-tests/conflict-check per task type)
  8. Implements the fix/feature with validation
  9. Creates a draft PR (az repos pr create --draft)
  10. Runs smart review (code review + conditional agents)
  11. Aggressively self-fixes all findings
  12. Simplifies changed code
  13. Posts completion report as discussion comment on the work item

provider: claude
model: sonnet
interactive: true

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: FETCH & CLASSIFY
  # ═══════════════════════════════════════════════════════════════

  - id: extract-item-number
    prompt: |
      Find the Azure DevOps work item number for this request.

      Request: $ARGUMENTS

      Rules:
      - If the message contains an explicit item number (e.g., "#709", "AB#709", "work item 709", "item 709", "709"), extract that number.
      - If the message is ambiguous (e.g., "fix the login timeout bug"), search with WIQL:
        ```bash
        az boards query --wiql "SELECT [System.Id],[System.Title] FROM workitems \
          WHERE [System.TeamProject] = @project \
          AND [System.State] <> 'Closed' \
          AND [System.Title] CONTAINS '<search-term>' \
          ORDER BY [System.ChangedDate] DESC"
        ```
        Pick the best match and extract its Id field.

      CRITICAL: Your final output must be ONLY the bare number with no quotes, no markdown, no explanation.
      Example correct output: 709
    model: haiku
    context: fresh

  - id: fetch-item
    bash: |
      ITEM_NUM=$(echo "$extract-item-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      if [ -z "$ITEM_NUM" ]; then
        echo "Failed to extract work item number from: $extract-item-number.output" >&2
        exit 1
      fi
      echo "$ITEM_NUM" > "$ARTIFACTS_DIR/.work-item-id"
      az boards work-item show --id "$ITEM_NUM" --expand all
    depends_on: [extract-item-number]

  - id: classify
    prompt: |
      You are an issue classifier. Analyze the Azure DevOps work item below and determine its type.

      ## Work Item Content

      $fetch-item.output

      Note: AzDO work items store data under `fields`:
      - `fields['System.WorkItemType']` — Bug, User Story, Task, Feature, Epic
      - `fields['System.Title']` — title
      - `fields['System.Description']` — description (HTML, ignore tags)
      - `fields['System.State']` — Active, Resolved, Closed, etc.

      ## Classification Rules

      | Type | Indicators |
      |------|------------|
      | bug | WorkItemType=Bug OR "broken", "error", "crash", "doesn't work", stack traces, regression |
      | feature | WorkItemType=Feature/Epic OR "add", "new", "support", net-new capability |
      | enhancement | WorkItemType=User Story OR "improve", "better", "extend", incremental improvement |
      | refactor | "clean up", "simplify", "reorganize", "restructure" |
      | chore | WorkItemType=Task OR "update deps", "upgrade", "maintenance", "CI/CD" |
      | documentation | "docs", "readme", "clarify", "examples" |

      Provide reasoning for your classification.
    depends_on: [fetch-item]
    model: haiku
    allowed_tools: []
    context: fresh
    output_format:
      type: object
      properties:
        issue_type:
          type: string
          enum: ["bug", "feature", "enhancement", "refactor", "chore", "documentation"]
        title:
          type: string
        reasoning:
          type: string
      required: [issue_type, title, reasoning]

  # Classify task complexity (runs in parallel with web-research)
  - id: complexity-gate
    prompt: |
      Classify this Azure DevOps work item as simple or complex.

      ## Work Item
      $fetch-item.output

      ## Classification (from earlier step)
      $classify.output

      ## Simple task — ALL of these must hold:
      - Acceptance criteria has ≤ 2 items (count `<li>` tags or bullet lines in the AC HTML)
      - Title + description contain NONE of: refactor, architect, migrat, schema, database,
        extract, consolidat, modulariz, split, seam, redesign, restructure, new endpoint,
        new service, new component
      - Change is clearly a UI/asset swap, text update, config change, or small isolated bug fix

      ## Complex task — ANY one of these applies:
      - AcceptanceCriteria has 3+ items
      - Complexity keywords present in title or description (see above)
      - Structural code changes (new files, new services, schema changes, new components)

      ## Quality gates by issue_type:
      | issue_type | quality_gates |
      |---|---|
      | bug | lint,build,tests,conflict-check |
      | feature | lint,build,tests,new-tests,conflict-check |
      | enhancement | lint,build,tests,new-tests,conflict-check |
      | refactor | lint,build,tests,conflict-check |
      | chore | lint,build,conflict-check |
      | documentation | conflict-check |

      Return the classification with the quality_gates appropriate for this issue_type.
    depends_on: [fetch-item, classify]
    model: haiku
    allowed_tools: []
    context: fresh
    output_format:
      type: object
      properties:
        complexity:
          type: string
          enum: ["simple", "complex"]
        reason:
          type: string
        quality_gates:
          type: string
          description: "comma-separated quality gates appropriate for this issue_type"
        ac_count:
          type: integer
          description: "number of acceptance criteria items found"
      required: [complexity, reason, quality_gates, ac_count]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: CODEBASE CONTEXT (code-review-graph first, grep fallback)
  # This is a LOCAL codebase connected to Azure DevOps — no web search needed.
  # ═══════════════════════════════════════════════════════════════

  - id: crg-context
    prompt: |
      Gather codebase context for this Azure DevOps work item.
      This is a LOCAL codebase — no web search needed.
      Use code-review-graph MCP tools FIRST; grep/Read only as fallback.

      ## Work Item
      $fetch-item.output

      ## Classification
      $classify.output

      ---

      ## Step 1: Graph-first investigation

      Use code-review-graph MCP tools BEFORE any Grep or Read calls:

      1. `semantic_search_nodes` — find symbols and files mentioned in the work item title/description
      2. `get_architecture_overview` — understand module and layer structure
      3. `get_impact_radius` on the most likely change target — blast radius
      4. `query_graph` with `callers_of` and `tests_for` — find callers and existing tests
      5. `get_review_context` — get relevant code snippets for the found nodes

      If code-review-graph is unavailable or returns no results, fall back to:
      ```bash
      git log --oneline -10
      # then targeted grep and selective file reads
      ```

      ## Step 2: Determine change scope

      Classify as one of:
      - `single-file` — one CSS/config/text change, no logic changes
      - `component` — one or two UI components, no new services
      - `multi-file` — multiple logical layers affected
      - `service-level` — new endpoints, schema changes, or cross-service impact

      ## Step 3: Write artifact
      Write `$ARTIFACTS_DIR/web-research.md`:

      ```markdown
      # Codebase Context — [work item title]

      ## Relevant Components
      [files and functions from CRG — include file:line references]

      ## Impact Radius
      [callers, dependents, related test files]

      ## Change Scope
      [single-file | component | multi-file | service-level] — [one-sentence reasoning]

      ## Existing Test Coverage
      [test files that cover the affected code]

      ## Key Pointers
      [root cause hints, git blame leads, anything that speeds up investigation/implement]
      ```

      Print: `CRG context: [N] nodes found, scope: [scope]`
    depends_on: [classify]
    context: fresh
    provider: pi
    model: kimi-for-coding

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: INVESTIGATE (bugs) / PLAN (features)
  # ═══════════════════════════════════════════════════════════════

  - id: investigate
    command: archon-investigate-issue
    depends_on: [classify, crg-context, complexity-gate]
    when: "$classify.output.issue_type == 'bug'"
    context: fresh

  - id: plan
    command: archon-create-plan
    depends_on: [classify, crg-context, complexity-gate]
    when: "$classify.output.issue_type != 'bug'"
    context: fresh

  # Bridge: ensure investigation.md exists for the implement step
  - id: bridge-artifacts
    bash: |
      if [ -f "$ARTIFACTS_DIR/plan.md" ] && [ ! -f "$ARTIFACTS_DIR/investigation.md" ]; then
        cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/investigation.md"
        echo "Bridged plan.md to investigation.md for implement step"
      elif [ -f "$ARTIFACTS_DIR/investigation.md" ]; then
        echo "investigation.md exists from investigate step"
      else
        echo "WARNING: No investigation.md or plan.md found — implement may fail"
      fi
    depends_on: [investigate, plan]
    trigger_rule: one_success

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3.5: ENGINEERING REVIEW GATE (from pc-director)
  # Complex tasks only — user confirms architecture risks before implementation.
  # Simple tasks bypass via simple-path-bridge.
  # Both paths converge at quality-gate-config.
  # ═══════════════════════════════════════════════════════════════

  - id: eng-review
    loop:
      prompt: |
        # Engineering Review Gate (GATE A) — /plan-eng-review

        **Work item**: $fetch-item.output
        **Classification**: $classify.output
        **Complexity**: $complexity-gate.output
        **Previous user input**: $LOOP_USER_INPUT

        ---

        ## Every iteration — check approval first
        ```bash
        echo "$LOOP_USER_INPUT" | grep -qi "approved" && echo "USER_APPROVED" || true
        ```
        If USER_APPROVED:
        - Say: "Engineering review approved. Proceeding to implementation."
        - Signal: <promise>ENG_REVIEW_APPROVED</promise>
        - Stop. Do not re-run the review.

        ---

        ## First iteration (when $LOOP_USER_INPUT is empty)

        ### 1. Run gstack preamble
        ```bash
        _UPD=$(~/.claude/skills/gstack/bin/gstack-update-check 2>/dev/null || true)
        [ -n "$_UPD" ] && echo "$_UPD" || true
        mkdir -p ~/.gstack/sessions && touch ~/.gstack/sessions/"$PPID"
        eval "$(~/.claude/skills/gstack/bin/gstack-slug 2>/dev/null)" 2>/dev/null || true
        _BRANCH=$(git branch --show-current 2>/dev/null || echo "unknown")
        echo "BRANCH: $_BRANCH"
        _LEARN_FILE="${GSTACK_HOME:-$HOME/.gstack}/projects/${SLUG:-unknown}/learnings.jsonl"
        [ -f "$_LEARN_FILE" ] && echo "LEARNINGS: $(wc -l < "$_LEARN_FILE" | tr -d ' ')" || echo "LEARNINGS: 0"
        [ -f "$_LEARN_FILE" ] && [ "$(wc -l < "$_LEARN_FILE" | tr -d ' ')" -gt 5 ] 2>/dev/null && \
          ~/.claude/skills/gstack/bin/gstack-learnings-search --limit 3 2>/dev/null || true
        _REPO_TOP=$(git rev-parse --show-toplevel 2>/dev/null || echo "")
        [ -f "$HOME/.gbrain/config.json" ] && command -v gbrain >/dev/null 2>&1 && \
          [ -n "$_REPO_TOP" ] && [ -f "$_REPO_TOP/.gbrain-source" ] && \
          echo "GBrain: configured — prefer gbrain search/query over Grep" || true
        ~/.claude/skills/gstack/bin/gstack-timeline-log \
          '{"skill":"plan-eng-review","event":"archon-gate-a","branch":"'"$_BRANCH"'"}' 2>/dev/null || true
        ```

        ### 2. Load /plan-eng-review skill
        ```bash
        cat "${CLAUDE_SKILLS_DIR:-$HOME/.claude/skills}/plan-eng-review/SKILL.md"
        ```
        Read it in full. You will follow its interactive review flow now.

        ### 3. Load investigation and codebase context
        ```bash
        cat "$ARTIFACTS_DIR/investigation.md" 2>/dev/null || cat "$ARTIFACTS_DIR/plan.md" 2>/dev/null || echo "(no artifact)"
        cat CLAUDE.md 2>/dev/null | head -120 || echo "(no CLAUDE.md)"
        ```

        ### 4. Announce and run the review
        Tell the user:
        > "Starting Engineering Review (GATE A).
        >  Invoking /plan-eng-review with the ADO work item context pre-loaded."

        Follow plan-eng-review's instructions exactly with this ADO context pre-loaded:
        - Work item title, description, AC from $fetch-item.output
        - Issue type, classification from $classify.output
        - Complexity verdict, quality_gates, ac_count from $complexity-gate.output
        - Investigation/plan artifact loaded above

        Complete all four review sections (Architecture, Code Quality, Tests, Performance).
        Since this is an Archon interactive gate, present all findings as one comprehensive
        document rather than per-section AskUserQuestion stops.

        ### 5. Write eng-review.md and present
        ```bash
        cat > "$ARTIFACTS_DIR/eng-review.md" << 'ENGEOF'
        # Engineering Review — [work item title]

        ## Architecture Impact
        [which layers/services/components are affected]

        ## Affected Components
        [specific files and functions from investigation + code graph]

        ## Data Flow Changes
        [summary of the affected data path]

        ## Top 3 Risks
        1. [risk + mitigation]
        2. [risk + mitigation]
        3. [risk + mitigation]

        ## Code Quality Findings
        [DRY violations, error handling gaps, tech debt hotspots]

        ## Test Coverage Gaps
        [missing tests for new code paths; regressions to guard]

        ## Performance Considerations
        [N+1 risks, caching opportunities, memory concerns]

        ## Technical Approach
        [recommended implementation strategy from investigation + review]

        ## Quality Gates
        [quality_gates value from $complexity-gate.output]
        ENGEOF
        ```

        Present the review and ask:
        > "Engineering review complete. See findings above.
        > Type **'approved'** to proceed, or provide feedback to refine any section."

        ---

        ## Feedback iteration (when $LOOP_USER_INPUT has feedback)
        Read $ARTIFACTS_DIR/eng-review.md, incorporate feedback, rewrite the file, re-present.
        If feedback says "approved", signal: <promise>ENG_REVIEW_APPROVED</promise>
      until: ENG_REVIEW_APPROVED
      max_iterations: 5
      interactive: true
      gate_message: "Engineering review ready. Type 'approved' to proceed, or provide feedback on any section."
    depends_on: [bridge-artifacts, complexity-gate]
    when: "$complexity-gate.output.complexity == 'complex'"
    context: fresh
    model: sonnet

  - id: enrich-ado
    prompt: |
      Post the engineering review findings to the Azure DevOps work item as a discussion comment.
      ADO renders HTML — use HTML tags, not markdown.

      ## Step 1: Load artifacts
      ```bash
      ITEM_ID=$(cat "$ARTIFACTS_DIR/.work-item-id")
      cat "$ARTIFACTS_DIR/eng-review.md"
      ```

      ## Step 2: Post HTML comment to ADO ticket
      ```bash
      az boards work-item update --id "$ITEM_ID" --discussion "<h2>Engineering Review (Archon)</h2><h3>Architecture Impact</h3><p>...</p><h3>Top Risks</h3><ul><li>...</li></ul><h3>Technical Approach</h3><p>...</p><h3>Quality Gates</h3><p>...</p>"
      ```
      Convert the eng-review.md content to HTML sections for the comment body.

      ## Step 3: Append technical AC to the AcceptanceCriteria field
      ```bash
      EXISTING_AC=$(az boards work-item show --id "$ITEM_ID" \
        --query "fields.\"Microsoft.VSTS.Common.AcceptanceCriteria\"" -o tsv 2>/dev/null || echo "")
      TECHNICAL_AC="${EXISTING_AC}<h2>Technical Acceptance Criteria (Archon Engineering Review)</h2><ul><li>All quality gates pass: ...</li><li>No new test regressions</li><li>Implementation matches technical approach from engineering review</li></ul>"
      az boards work-item update --id "$ITEM_ID" \
        --fields "Microsoft.VSTS.Common.AcceptanceCriteria=$TECHNICAL_AC"
      ```

      ## Step 4: Write quality gates to artifact
      ```bash
      echo "$quality_gates_from_complexity_gate" > "$ARTIFACTS_DIR/.quality-gates"
      cat "$ARTIFACTS_DIR/.quality-gates"
      ```
      (use the quality_gates value from $complexity-gate.output)

      ## Step 5: Confirm
      Print: "ADO work item $ITEM_ID enriched with engineering review comment and technical AC."
    depends_on: [eng-review]
    when: "$complexity-gate.output.complexity == 'complex'"
    context: fresh
    provider: pi
    model: kimi-k2.6

  - id: simple-path-bridge
    bash: |
      echo "Simple task: bypassing engineering review gate"
      # Write quality gates derived from complexity-gate classification
      echo "lint,build,conflict-check" > "$ARTIFACTS_DIR/.quality-gates"
      cat "$ARTIFACTS_DIR/.quality-gates"
      echo "simple-path-bridge: done"
    depends_on: [bridge-artifacts, complexity-gate]
    when: "$complexity-gate.output.complexity == 'simple'"

  - id: quality-gate-config
    prompt: |
      Configure quality gates for the implementation step.

      ## Complexity assessment
      $complexity-gate.output

      ## Step 1: Read the quality gates from artifacts
      ```bash
      cat "$ARTIFACTS_DIR/.quality-gates" 2>/dev/null || echo "(not yet written)"
      ```

      ## Step 2: Write final quality gates
      Use the `quality_gates` field from the complexity-gate output.
      ```bash
      echo "<quality_gates_value>" > "$ARTIFACTS_DIR/.quality-gates"
      ```

      ## Step 3: Append quality gates to investigation artifact
      The implement step reads investigation.md — append the quality gates so the agent knows what to verify.
      ```bash
      GATES=$(cat "$ARTIFACTS_DIR/.quality-gates")
      cat >> "$ARTIFACTS_DIR/investigation.md" << GATEEOF

      ---
      ## Quality Gates Required (from pc-director gate classification)

      Run these before committing: \`$GATES\`

      | Gate | Command |
      |------|---------|
      | lint | bun run lint (or project linter) |
      | build | bun run build (or project build) |
      | tests | bun test (baseline then current, no new failures) |
      | new-tests | verify new test files exist for new behavior |
      | conflict-check | git fetch origin; git merge-base --is-ancestor origin/<base> HEAD |

      Do NOT mark done without passing all required gates.
      GATEEOF
      ```

      ## Step 4: Confirm
      Print: "Quality gates configured: <value>"
    depends_on: [enrich-ado, simple-path-bridge]
    trigger_rule: one_success
    model: haiku
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    command: archon-fix-issue
    depends_on: [quality-gate-config]
    context: fresh
    provider: pi
    model: kimi-for-coding

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: VALIDATE
  # ═══════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implement]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: CREATE DRAFT PR
  # ═══════════════════════════════════════════════════════════════

  - id: create-pr
    prompt: |
      Create a draft pull request using the Azure DevOps CLI.

      ## Context

      - **Work Item**: $ARGUMENTS
      - **Classification**: $classify.output
      - **Item title**: $classify.output.title

      ## Instructions

      1. Check git status. If uncommitted changes exist, stage and commit ONLY source files that are
         part of the fix. Use `git add <path1> <path2> ...` — never `git add -A` or `git add .`.
         Never commit artifacts (anything under `$ARTIFACTS_DIR`, `pr-body.md`, `*.scratch.md`).
         Verify with `git status --porcelain` before committing.

      2. Push the branch:
         ```bash
         git push -u origin HEAD
         ```

      3. Read implementation artifacts for context:
         ```bash
         cat "$ARTIFACTS_DIR/investigation.md" 2>/dev/null
         cat "$ARTIFACTS_DIR/plan.md" 2>/dev/null
         cat "$ARTIFACTS_DIR/implementation.md" 2>/dev/null
         cat "$ARTIFACTS_DIR/validation.md" 2>/dev/null
         ITEM_ID=$(cat "$ARTIFACTS_DIR/.work-item-id" 2>/dev/null)
         ```

      4. Check if a PR already exists for this branch:
         ```bash
         CURRENT_BRANCH=$(git branch --show-current)
         az repos pr list --source-branch "$CURRENT_BRANCH" --status active --output json
         ```
         If one exists, capture its `pullRequestId` and skip to step 7.

      5. Look for a PR description template at `.azuredevops/pull_request_template.md`,
         `pull_request_template.md`, or `.github/PULL_REQUEST_TEMPLATE.md`. Read whichever exists.

      6. Create the draft PR:
         ```bash
         az repos pr create \
           --draft true \
           --target-branch $BASE_BRANCH \
           --title "<concise imperative title under 70 chars>" \
           --description "<full PR body>" \
           --work-items "$ITEM_ID"
         ```
         - If the description is long, write it to `$ARTIFACTS_DIR/pr-body.md` first, then use
           `--description "$(cat $ARTIFACTS_DIR/pr-body.md)"`.
         - Body must include: summary, changes, validation evidence, and `Related: AB#<item-id>`.
         - Fill in every section of the template if one was found.

      7. Capture PR identifiers:
         ```bash
         CURRENT_BRANCH=$(git branch --show-current)
         PR_JSON=$(az repos pr list --source-branch "$CURRENT_BRANCH" --status active --output json)
         PR_ID=$(echo "$PR_JSON" | jq -r '.[0].pullRequestId')
         PR_URL=$(echo "$PR_JSON" | jq -r '.[0].url')
         echo "$PR_ID" > "$ARTIFACTS_DIR/.pr-id"
         echo "$PR_ID" > "$ARTIFACTS_DIR/.pr-number"
         echo "$PR_URL" > "$ARTIFACTS_DIR/.pr-url"
         ```
    depends_on: [validate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: REVIEW
  # ═══════════════════════════════════════════════════════════════

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      PR_ID=$(cat "$ARTIFACTS_DIR/.pr-id" 2>/dev/null || echo "")
      if [ -z "$PR_ID" ]; then
        echo "PR ID not found in artifacts — skipping base verification"
        exit 0
      fi
      # AzDO returns refs/heads/main — strip prefix for comparison
      ACTUAL_REF=$(az repos pr show --id "$PR_ID" --query "targetRefName" -o tsv)
      ACTUAL="${ACTUAL_REF#refs/heads/}"
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        echo "Base mismatch on PR #$PR_ID: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        REPO_ID=$(az repos pr show --id "$PR_ID" --query "repository.id" -o tsv)
        PATCH_FILE=$(mktemp /tmp/pr-base-patch.XXXXXX.json)
        echo "{\"targetRefName\": \"refs/heads/$EXPECTED\"}" > "$PATCH_FILE"
        az devops invoke \
          --area git \
          --resource pullRequests \
          --route-parameters repositoryId="$REPO_ID" pullRequestId="$PR_ID" \
          --http-method PATCH \
          --in-file "$PATCH_FILE" \
          --api-version 7.1 \
          > /dev/null
        rm -f "$PATCH_FILE"
        echo "PR base updated to $EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [create-pr]

  - id: review-scope
    command: archon-azdo-pr-review-scope
    depends_on: [verify-pr-base]
    context: fresh

  - id: review-classify
    prompt: |
      You are a PR review classifier. Analyze the PR scope and determine which review agents should run.

      ## PR Scope

      $review-scope.output

      ## Rules

      - **Code review**: ALWAYS run. Mandatory for every PR. Also checks CLAUDE.md rules.
      - **Error handling**: Run if the diff touches try/catch, error handling, async/await, or new failure paths.
      - **Test coverage**: Run if the diff touches source code (not just tests, docs, or config).
      - **Comment quality**: Run if the diff adds or modifies comments, docstrings, or JSDoc.
      - **Docs impact**: Run if the diff adds/removes public APIs, CLI flags, env vars, or user-facing features.

      Provide your reasoning for each decision.
    depends_on: [review-scope]
    model: haiku
    allowed_tools: []
    context: fresh
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum: ["true", "false"]
        run_error_handling:
          type: string
          enum: ["true", "false"]
        run_test_coverage:
          type: string
          enum: ["true", "false"]
        run_comment_quality:
          type: string
          enum: ["true", "false"]
        run_docs_impact:
          type: string
          enum: ["true", "false"]
        reasoning:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - reasoning

  - id: code-review
    command: archon-code-review-agent
    depends_on: [review-classify]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_error_handling == 'true'"
    context: fresh
    provider: pi
    model: kimi-for-coding

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_test_coverage == 'true'"
    context: fresh
    provider: pi
    model: kimi-for-coding

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_comment_quality == 'true'"
    context: fresh
    provider: pi
    model: kimi-for-coding

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_docs_impact == 'true'"
    context: fresh
    provider: pi
    model: kimi-for-coding

  # ═══════════════════════════════════════════════════════════════
  # PHASE 8: SYNTHESIZE + SELF-FIX
  # ═══════════════════════════════════════════════════════════════

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh
    output_format:
      type: object
      properties:
        has_blocking_findings:
          type: boolean
          description: "true if there are CRITICAL or HIGH severity findings requiring fixes before merge"
        verdict:
          type: string
          enum: ["APPROVE", "REQUEST_CHANGES"]
        critical_count:
          type: integer
        high_count:
          type: integer
      required: [has_blocking_findings, verdict, critical_count, high_count]

  - id: self-fix
    command: archon-self-fix-all
    depends_on: [synthesize]
    when: "$synthesize.output.has_blocking_findings == 'true'"
    context: fresh
    provider: pi
    model: kimi-for-coding

  # ═══════════════════════════════════════════════════════════════
  # PHASE 9: SIMPLIFY
  # ═══════════════════════════════════════════════════════════════

  - id: simplify
    command: archon-simplify-changes
    depends_on: [self-fix, synthesize]
    trigger_rule: one_success
    context: fresh
    provider: pi
    model: kimi-for-coding

  # ═══════════════════════════════════════════════════════════════
  # PHASE 10: REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    prompt: |
      Post a completion report to the Azure DevOps work item as a discussion comment.

      ## Phase 1: Load Artifacts

      ```bash
      ITEM_ID=$(cat "$ARTIFACTS_DIR/.work-item-id" 2>/dev/null || echo "$ARGUMENTS" | grep -oE '[0-9]+' | head -1)
      PR_ID=$(cat "$ARTIFACTS_DIR/.pr-id" 2>/dev/null || echo "unknown")
      PR_URL=$(cat "$ARTIFACTS_DIR/.pr-url" 2>/dev/null || echo "unknown")
      QUALITY_GATES=$(cat "$ARTIFACTS_DIR/.quality-gates" 2>/dev/null || echo "not configured")
      cat "$ARTIFACTS_DIR/investigation.md" 2>/dev/null
      cat "$ARTIFACTS_DIR/plan.md" 2>/dev/null
      cat "$ARTIFACTS_DIR/eng-review.md" 2>/dev/null
      cat "$ARTIFACTS_DIR/implementation.md" 2>/dev/null
      cat "$ARTIFACTS_DIR/validation.md" 2>/dev/null
      cat "$ARTIFACTS_DIR/review/consolidated-review.md" 2>/dev/null
      cat "$ARTIFACTS_DIR/review/fix-report.md" 2>/dev/null
      git log --oneline -5
      ```

      ## Phase 2: Post Work Item Comment

      Compose a comment body and post it:

      ```bash
      az boards work-item update --id "$ITEM_ID" --discussion "<comment-body>"
      ```

      Comment format:
      ```
      ## Resolution Report

      **PR**: !$PR_ID ($PR_URL)
      **Status**: Complete

      ### Summary
      {2-4 sentences summarising what was done}

      ### Changes Made
      | File | Change |
      |------|--------|
      | `{file}` | {description} |

      ### Quality Gates
      **Gates run**: {QUALITY_GATES}
      {Pass/fail status for each gate that was run}

      ### Validation
      {Type check, lint, and test results}

      ### Review & Self-Fix
      - {n} review findings addressed
      - {n} tests added
      - {n} unaddressed items (with reasons if any)

      ### Suggested Follow-up Work Items
      {List items or "None."}

      ---
      Resolved by Archon workflow $WORKFLOW_ID
      ```

      ## Phase 3: Final Output

      Print: work item ID, PR ID, PR URL, and brief summary of what was done.

      Write the comment body to `$ARTIFACTS_DIR/completion-report.md` as well.
    depends_on: [simplify]
    context: fresh
    provider: pi
    model: kimi-for-coding
